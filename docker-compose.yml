# Local synthetic-data development ONLY. Not an ePHI production deployment.
# Supply credentials privately; DATABASE_URL must use the postgres service hostname
# and the same password as POSTGRES_PASSWORD, percent-encoded in its URL.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: med_app_db
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medapp -d med_app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["127.0.0.1:5001:5000"]
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for the postgres service}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      NODE_ENV: development
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TRUST_PROXY_HOPS: 1
      SESSION_TIMEOUT_MINUTES: 15
      ENABLE_EXTERNAL_AI: "false"
      ALLOW_SELF_REGISTRATION: "true"
      SEED_DATABASE: ${SEED_DATABASE:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
