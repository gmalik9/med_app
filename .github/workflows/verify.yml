name: Verify synthetic application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  required-integration:
    name: PG${{ matrix.pg }} / ${{ matrix.timezone }} / Node22
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '17']
        timezone: [UTC, America/New_York]
        include:
          # OCI index digests verified against the public registry on 2026-09-20.
          - pg: '15'
            image: postgres:15-alpine@sha256:a46e076249ce434e41203b8c1dadfaa025b9726331d72390df038385d6dc29cd
          - pg: '17'
            image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
          POSTGRES_DB: medapp_audit
          TZ: ${{ matrix.timezone }}
          PGTZ: ${{ matrix.timezone }}
        ports: ['55439:5432']
        options: --health-cmd="pg_isready -U audit -d medapp_audit" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
      TZ: ${{ matrix.timezone }}
      EXPECTED_PG_MAJOR: ${{ matrix.pg }}
      EXPECTED_PG_TIMEZONE: ${{ matrix.timezone }}
      ENABLE_EXTERNAL_AI: 'false'
      SEED_DATABASE: 'false'
    steps:
      # Public GitHub tag metadata resolved to commits; see track-a-release evidence.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure isolated audit credentials without logging the URL
        run: node tests/configure-test-database.mjs
      - run: npm ci
      - name: Record suite classification and enforce the exact synthetic URL
        run: |
          npm run test:inventory
          node tests/release-runner.mjs --check-database
      - name: Confirm database major and actual server timezone
        run: node tests/release-database-info.mjs
      - run: npm exec -- playwright install --with-deps chromium
      - name: Required integration, types, lint, units, builds, browser and dependency checks
        run: npm run verify:release

  release-required:
    name: Release required
    if: always()
    needs: [required-integration]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Refuse failed or skipped integration matrix
        env:
          RESULT: ${{ needs.required-integration.result }}
        run: test "$RESULT" = success
