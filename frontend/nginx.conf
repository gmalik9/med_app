# Only the checksum-pinned, versioned public model is immutable. APIs/HTML and
# the generated bridge remain no-store. Model query variants serve the same bytes.
# The longer packaging-version URL exceeds the default 64-byte map bucket.
map_hash_bucket_size 128;
map "$status:$uri" $vosk_cache_control {
  default "no-store";
  "200:/models/vosk-model-small-en-in-0.4-browser-v2.tar.gz" "public, max-age=31536000, immutable";
  "206:/models/vosk-model-small-en-in-0.4-browser-v2.tar.gz" "public, max-age=31536000, immutable";
  "304:/models/vosk-model-small-en-in-0.4-browser-v2.tar.gz" "public, max-age=31536000, immutable";
}

# 0.0.8 Emscripten embind uses new Function for bindings. Restrict its necessary
# unsafe-eval exception to the standalone worker response, NOT application HTML.
map $uri $vosk_script_policy {
  default "'self'";
  /vosk/vosk-browser-0.0.8.worker.js "'self' 'unsafe-eval'";
}

server {
  listen 8080;
  server_tokens off;
  # Patient identifiers can occur in URLs; API metadata audits replace raw access logs.
  access_log off;
  error_log /dev/stderr crit;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control $vosk_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src $vosk_script_policy; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location = /models/vosk-model-small-en-in-0.4-browser-v2.tar.gz { try_files $uri =404; }
  # Never overwrite/re-serve the retired immutable v1 path, even when a local
  # public directory still contains its ignored historical artifact.
  location = /models/vosk-model-small-en-in-0.4.tar.gz { return 404; }
  location /models/ { try_files $uri =404; }
  location /vosk/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
